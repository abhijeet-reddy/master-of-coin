name: Build and Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and push (e.g., v1.0.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Build platform-specific images in parallel (native runners = no QEMU)
  # ============================================================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Emit a BARE semver for steps.meta.outputs.version (0.22.0, not the
          # raw ref v0.22.0), matching the merge job and the ghcr tag. This
          # feeds APP_VERSION (issue #83); without it the default was the ref,
          # which baked APP_VERSION=v0.22.0 and rendered "vv0.22.0" in the UI.
          tags: |
            type=semver,pattern={{version}}

      # Build and push by digest (no tag yet — tags applied in merge job)
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Version display (issue #83): APP_VERSION MUST come from the SAME
          # value that feeds the image label (steps.meta.outputs.version), so
          # the displayed version and the org.opencontainers.image.version label
          # can never disagree. Do not derive the version a second way here.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Save digest to artifact for merge job
      - name: Save digest artifact
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # Merge platform images into multi-arch manifest and apply tags
  # ============================================================================
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Create multi-arch manifest from platform-specific digests
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image and get digest
        id: inspect
        run: |
          FULL_OUTPUT=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }})
          echo "${FULL_OUTPUT}"
          DIGEST=$(echo "${FULL_OUTPUT}" | grep -m1 '^Digest:' | awk '{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: ${DIGEST}"

      # Generate cryptographic attestation for supply chain security
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  # ============================================================================
  # Trigger Iron Fleet stack redeployment via webhook
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: merge
    if: success()

    steps:
      - name: Trigger deployment webhook
        env:
          WEBHOOK_URL: ${{ secrets.IRON_FLEET_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.IRON_FLEET_WEBHOOK_SECRET }}
        run: |
          # Build a minimal GitHub-style webhook payload
          PAYLOAD=$(cat <<'EOF'
          {
            "action": "published",
            "repository": {
              "full_name": "${{ github.repository }}"
            },
            "sender": {
              "login": "${{ github.actor }}"
            }
          }
          EOF
          )

          # Compute HMAC-SHA256 signature (GitHub webhook format)
          SIGNATURE="sha256=$(echo -n "${PAYLOAD}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" | awk '{print $2}')"

          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: ${SIGNATURE}" \
            -H "X-GitHub-Event: release" \
            -d "${PAYLOAD}" \
            "${WEBHOOK_URL}")

          echo "HTTP Status: ${HTTP_STATUS}"
          cat /tmp/response.txt

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Deployment webhook failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi

          echo "✅ Deployment webhook triggered successfully"
